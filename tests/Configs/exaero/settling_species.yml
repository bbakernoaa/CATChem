# Exaero species configuration for the native C++ settling engine
# (scheme: gocart_cpp).  Species are labelled by canonical aerosol TYPE
# (the __mie_name in the CATChem species metadata), which is the key the
# settling process uses to resolve each species into this package and
# which binds exaero's baked microphysical curves (DU, SS, SU, BC, OC, NI).
species:
  - name: "DU"
    dry_density: 2600.0
    molecular_weight: 100.0
    dry_particle_diameter: 2.0e-6
    hygroscopicity: 0.1
    lognormal_sigma: 1.5
    lognormal_dg: 1.0e-6
    refractive_index_real: 1.55
    refractive_index_imag: 0.002
  - name: "SS"
    dry_density: 2200.0
    molecular_weight: 58.5
    dry_particle_diameter: 1.0e-6
    hygroscopicity: 0.5
    lognormal_sigma: 1.5
    lognormal_dg: 1.0e-6
    refractive_index_real: 1.4
    refractive_index_imag: 0.001
  - name: "SU"
    dry_density: 1700.0
    molecular_weight: 96.06
    dry_particle_diameter: 0.7e-6
    hygroscopicity: 0.55
    lognormal_sigma: 1.5
    lognormal_dg: 0.7e-6
    refractive_index_real: 1.45
    refractive_index_imag: 0.001
  - name: "BC"
    dry_density: 1800.0
    molecular_weight: 12.0
    dry_particle_diameter: 0.7e-6
    hygroscopicity: 0.0
    lognormal_sigma: 1.5
    lognormal_dg: 0.7e-6
    refractive_index_real: 1.75
    refractive_index_imag: 0.7
  - name: "OC"
    dry_density: 1800.0
    molecular_weight: 150.0
    dry_particle_diameter: 0.7e-6
    hygroscopicity: 0.01
    lognormal_sigma: 1.5
    lognormal_dg: 0.7e-6
    refractive_index_real: 1.55
    refractive_index_imag: 0.001
