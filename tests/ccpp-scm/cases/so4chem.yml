schema_version: 1
case_id: so4chem-arm-sgp-sulfur
scm_case: arm_sgp_summer_1997_A
processes:
  - so4chem
acceptance_fixture:
  aerosol_mixing_ratio_kg_kg: 1.0e-8
  sulfur_dioxide_mole_fraction_ppmv: 0.1
  dimethyl_sulfide_mole_fraction_ppmv: 0.05
  hydrogen_peroxide_mole_fraction_ppmv: 0.001
  hydroxyl_radical_mole_fraction_ppmv: 1.0e-8
  nitrate_radical_mole_fraction_ppmv: 1.0e-4
  species: so2, dms, h2o2, oh, so4, msa
  basis: GFS v17 case with declared diagnostic sulfur gases, OH/H2O2 and night-time NO3 oxidants, and aerosol initial quantities; gas fixture ppmv is converted to the host dry-air mass ratio before seeding the full framework-owned constituent array
inputs:
  - name: ccpp_constituents
    units: species-declared
    basis: full framework constituent array mapped by registered standard names, including sulfur gases, oxidants, and aerosols
  - name: gfs_v17_so4chem_meteorology
    units: K, Pa, m2 s-2, W m-2, degrees, m s-1, cm
    basis: layer thermodynamics, interface geopotential, clouds, sensible heat, surface location, winds, friction velocity, land/ice mask and roughness
outputs:
  - name: so4chem_sulfur_tendency
    signal_name: so4chem_constituent_max_abs_delta
    units: host constituent representation
    basis: selected GOCART sulfur chemistry concentration change over one 600 s interval
    must_be_nonzero: true
    minimum_abs_value: 1.0e-14
    maximum_abs_value: 1.0e6
reference:
  method: native_parity
  description: Matched one-step native SO4Chem replay from the exact GFS v17 ARM SGP process-input ledger and pre-update 23-species CCPP state; the ARM land suite uses prescribed surface fluxes per CCPP-SCM case guidance.
  source_revision: 900ec02691ae9a4ef250183ec86f7050b1d2d6b9
  evidence:
    - build/ccpp-scm/native-replay/arm-sgp-a-so4chem-call-0-parity.json
tolerances:
  - quantity: so4chem_sulfur_tendency
    absolute: 1.0e-12
    relative: 1.0e-6
    rationale: Same-boundary replay compared all 2,921 mapped species-level values with zero observed error; the 1e-6 limit allows compiler and backend floating-point variation.
budgets:
  - quantity: so4chem_sulfur_production
    equation: integrated SO4 and MSA production equals their registered per-species production diagnostics
    units: kg kg-1 s-1
    basis: sulfur species production across column levels
    residual_tolerance: 1.0e-10
    absolute_tolerance: 1.0e-10 ug/kg
    rationale: Sulfur production closes against the registered SO4 and MSA species diagnostics.
frozen_before_candidate_comparison: true
