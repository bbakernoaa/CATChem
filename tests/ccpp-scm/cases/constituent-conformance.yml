    air_basis: dry
    units: ppmv
  - amount_type: mass_mixing_ratio
    air_basis: dry
    units: kg kg-1
  - amount_type: mass_mixing_ratio
    air_basis: moist
    units: kg kg-1
  - amount_type: mass_mixing_ratio
    air_basis: total_with_condensate
    units: kg kg-1
  aerosol:
