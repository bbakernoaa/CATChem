      - dust4
      - dust5
      - seas1
      - seas2
      - seas3
      - seas4
      - seas5
      - so4
      - msa
      - bc1
      - bc2
      - oc1
      - oc2
      - unrelated_tracer
      permuted_slot_order:
      - unrelated_tracer
