simulation:
  name: ccpp_scm_dust
  species_filename: ../../../../tests/Configs/Default/CATChem_species.yml
  verbose:
    activate: true
grid:
  number_of_levels: 64
  number_of_soil_layers: 4
timesteps:
  transport_timestep_in_s: 600
  chemistry_timestep_in_s: 600
run_phases:
  ccpp_selected_process:
    description: Run only the CCPP-selected Dust process
    processes:
      - dust
processes:
  dust:
    activate: true
    diagnostics: true
    scheme: ginoux
    ginoux:
      Ch_DU: [0.07, 0.07, 0.07, 0.07, 0.07]
