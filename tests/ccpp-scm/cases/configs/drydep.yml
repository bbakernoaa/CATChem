simulation:
  name: ccpp_scm_drydep
  species_filename: ../../../../tests/Configs/Default/CATChem_species.yml
  verbose:
    activate: true
grid:
  number_of_levels: 64
  number_of_soil_layers: 4
timesteps:
  transport_timestep_in_s: 600
  chemistry_timestep_in_s: 600
run_phases:
  ccpp_selected_process:
    description: Run only the CCPP-selected DryDep process
    processes:
      - drydep
processes:
  drydep:
    activate: true
    diagnostics: true
    gas_scheme: wesely
    aero_scheme: gocart
    wesely:
      scale_factor: 1.0
    gocart:
      scale_factor: 1.0
      resuspension: false
      dust_resuspension_only: true
