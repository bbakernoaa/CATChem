schema_version: 1
case_id: settling-bomex
scm_case: bomex
processes:
  - settling
acceptance_fixture:
  aerosol_mixing_ratio_kg_kg: 1.0e-12
  species: dust1..dust5, seas1..seas5, so4, msa, bc1..bc2, oc1..oc2
  basis: uniform initial host mass mixing ratio in the full CCPP constituent array
inputs:
  - name: ccpp_constituents
    units: scheme-declared
    basis: full framework constituent array, mapped by constituent properties
  - name: settling_meteorology
    units: K, Pa, kg m-3, 1, m
    basis: GFS v17 temperature, pressure, moist density, relative humidity and interface height
outputs:
  - name: settling_constituent_state_after_update
    signal_name: settling_constituent_max_abs_delta
    units: host constituent representation
    basis: selected Settling update over one 600 s GFS v17 BOMEX physics interval
    must_be_nonzero: true
reference:
  method: native_parity
  description: Matched native Settling replay from the exact BOMEX process-input ledger and pre-update 23-species CCPP state. All 2,921 mapped species-level values compare at the same interval and subcycle boundary; the report is build/ccpp-scm/native-replay/bomex-settling-call-0-parity.json.
  source_revision: 900ec02691ae9a4ef250183ec86f7050b1d2d6b9
  evidence:
    - build/ccpp-scm/native-replay/bomex-settling-call-0-parity.json
tolerances:
  - quantity: settling_constituent_state_after_update
    absolute: 1.0e-12
    relative: 1.0e-6
    rationale: Frozen from the matched native replay; 2,921 values passed with maximum observed relative error 8.43e-7 and maximum absolute error 4.40e-13.
budgets:
  - quantity: settling_aerosol_column
    equation: initial column aerosol mass minus final column mass equals sedimentation flux divergence
    units: kg m-2
    basis: per species over the 600 s SCM interval
    residual_tolerance: 1.0e-10
    rationale: Settling conserves aerosol column mass except for the diagnosed boundary flux.
frozen_before_candidate_comparison: true
